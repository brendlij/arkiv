services:
  arkiv:
    image: ${ARKIV_IMAGE:-ghcr.io/brendlij/arkiv:latest}
    pull_policy: always
    restart: unless-stopped
    init: true
    ports:
      - "${ARKIV_HOST_PORT:-8090}:8090"
    environment:
      TZ: ${TZ:-Europe/Berlin}
      ARKIV_USERNAME: ${ARKIV_USERNAME:-admin}
      ARKIV_PASSWORD_HASH: ${ARKIV_PASSWORD_HASH:?Set ARKIV_PASSWORD_HASH in .env}
      ARKIV_DATABASE: /data/gallery.db
      ARKIV_CACHE: /cache
      ARKIV_LIBRARY: /photos
      ARKIV_UPLOAD_DIR: ${ARKIV_UPLOAD_DIR:-/photos/originals}
      ARKIV_PORT: "8090"
      ARKIV_SCAN_ON_START: ${ARKIV_SCAN_ON_START:-true}
      ARKIV_SCAN_INTERVAL: ${ARKIV_SCAN_INTERVAL:-30m}
      ARKIV_WORKERS: ${ARKIV_WORKERS:-2}
      ARKIV_UPLOAD_QUOTA_BYTES: ${ARKIV_UPLOAD_QUOTA_BYTES:-5368709120}
      ARKIV_UPLOAD_RETENTION: ${ARKIV_UPLOAD_RETENTION:-168h}
      ARKIV_SECURE_COOKIES: ${ARKIV_SECURE_COOKIES:-false}
    volumes:
      - type: bind
        source: ${ARKIV_PHOTOS_DIR:-./photos}
        target: /photos
        bind:
          create_host_path: false
      - type: bind
        source: ${ARKIV_DATA_DIR:-./data}
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: ${ARKIV_CACHE_DIR:-./cache}
        target: /cache
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 45s
    pids_limit: 128

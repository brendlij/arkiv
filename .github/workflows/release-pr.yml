name: Release PR

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

jobs:
  release-metadata:
    name: Release metadata
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate release branch and metadata
        if: startsWith(github.head_ref, 'release/')
        env:
          BRANCH: ${{ github.head_ref }}
        shell: bash
        run: |
          if [[ ! "$BRANCH" =~ ^release/v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Release branches must be named release/vX.Y.Z" >&2
            exit 1
          fi

          version="${BASH_REMATCH[1]}"
          package_version="$(node -p "require('./web/package.json').version")"
          test "$package_version" = "$version" || {
            echo "web/package.json is $package_version; expected $version" >&2
            exit 1
          }
          grep -Eq "^## \[$version\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md || {
            echo "CHANGELOG.md needs a dated ## [$version] release heading" >&2
            exit 1
          }
          grep -Fq "## [Unreleased]" CHANGELOG.md || {
            echo "CHANGELOG.md must retain an Unreleased section" >&2
            exit 1
          }

      - name: Accept ordinary pull request
        if: ${{ !startsWith(github.head_ref, 'release/') }}
        run: echo "No release metadata required."
